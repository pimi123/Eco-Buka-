# Review/merge into the FRONTEND virtual host, replacing its old CSP directives.
# Multiple enforcing policies intersect: leaving script-src 'self' in another
# policy will still block the SDKs. No unsafe-inline JavaScript is needed.
# Review both enforcing and report-only policies. Preserve the bank allowlist.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://ecommerce.teb-kos.com; script-src 'self' https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.ecoflowks.com https://www.facebook.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://api.ecoflowks.com https://www.facebook.com https://connect.facebook.net https://www.google-analytics.com https://region1.google-analytics.com; media-src 'self' blob: https://api.ecoflowks.com; worker-src 'self' blob:; frame-src 'none';" always;
